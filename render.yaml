services:
  - type: web
    name: veloclip-backend
    runtime: python
    region: oregon
    plan: free
    # imageio-ffmpeg provides the self-contained static FFmpeg binary
    buildCommand: pip install --upgrade -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PORT
        value: 10000
