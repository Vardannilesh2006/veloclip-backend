services:
  - type: web
    name: veloclip-backend
    runtime: python
    region: oregon
    plan: free
    # Do not reuse an old cached media extractor: platform parsers change often.
    # ffmpeg is required for reliable audio extraction and video+audio muxing.
    buildCommand: apt-get update && apt-get install -y --no-install-recommends ffmpeg && pip install --upgrade -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PORT
        value: 10000
